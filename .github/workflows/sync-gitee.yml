name: 同步哒哒API Image2 插件至 Gitee

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitee-main
  cancel-in-progress: true

jobs:
  sync:
    environment: production-release
    runs-on: ubuntu-latest
    env:
      GITEE_REPOSITORY: ${{ vars.GITEE_REPOSITORY || 'lyq_power/dadaapi-image2-plugin' }}
      GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'lyq_power' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Gitee mirror configuration
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GITEE_REPOSITORY" ]; then
            echo "::error title=Missing Gitee repository::Set the GITEE_REPOSITORY Actions variable to your Gitee owner/repository target."
            exit 1
          fi
          if ! [[ "$GITEE_REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=Invalid Gitee repository::GITEE_REPOSITORY must use owner/repository format."
            exit 1
          fi
          if [ -n "$GITEE_USERNAME" ] && ! [[ "$GITEE_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=Invalid Gitee username::GITEE_USERNAME must contain only letters, numbers, dots, underscores, or hyphens."
            exit 1
          fi
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error title=Missing Gitee token::Add a GITEE_TOKEN Actions secret with write access to $GITEE_REPOSITORY."
            exit 1
          fi

      - name: Create Gitee repository when missing
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          authorization="Authorization: token $GITEE_TOKEN"
          repository_name="${GITEE_REPOSITORY#*/}"
          repository_api="https://gitee.com/api/v5/repos/$GITEE_REPOSITORY"
          response="$RUNNER_TEMP/dada-gitee-repository.json"

          http_code=$(curl -sS --connect-timeout 20 --max-time 60 \
            -o "$response" \
            -w '%{http_code}' \
            -H "$authorization" \
            "$repository_api")
          case "$http_code" in
            200)
              jq -e --arg repository "$GITEE_REPOSITORY" \
                '.full_name == $repository' "$response" >/dev/null || {
                echo "::error title=Invalid Gitee repository response::The target does not match the configured repository."
                exit 1
              }
              echo "Gitee repository $GITEE_REPOSITORY already exists."
              ;;
            404)
              created_response="$RUNNER_TEMP/dada-gitee-repository-created.json"
              created_code=$(curl -sS --connect-timeout 20 --max-time 60 \
                -o "$created_response" \
                -w '%{http_code}' \
                -X POST \
                -H "$authorization" \
                -H 'Accept: application/json' \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "name=$repository_name" \
                --data-urlencode "path=$repository_name" \
                --data-urlencode "description=哒哒API Image2 Codex 插件" \
                --data-urlencode "auto_init=false" \
                --data-urlencode "public=1" \
                "https://gitee.com/api/v5/user/repos")
              if [ "$created_code" != 201 ]; then
                echo "::error title=Unable to create Gitee repository::Gitee API returned HTTP $created_code."
                jq -c '{message, code}' "$created_response" >&2 || true
                exit 1
              fi
              echo "Created Gitee repository $GITEE_REPOSITORY."
              ;;
            *)
              echo "::error title=Unable to inspect Gitee repository::Gitee API returned HTTP $http_code."
              jq -c '{message, code}' "$response" >&2 || true
              exit 1
              ;;
          esac

      - name: Sync repository files through Gitee API
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          authorization="Authorization: token $GITEE_TOKEN"
          repository_api="https://gitee.com/api/v5/repos/$GITEE_REPOSITORY"
          branch_api="$repository_api/branches/main"
          response="$RUNNER_TEMP/dada-gitee-sync-response.json"
          remote_paths="$RUNNER_TEMP/dada-gitee-remote-paths.tsv"
          local_paths="$RUNNER_TEMP/dada-gitee-local-paths.tsv"
          content_path="$RUNNER_TEMP/dada-gitee-file-content.b64"
          file_url=""

          branch_code=$(curl -sS --connect-timeout 20 --max-time 60 \
            -o "$response" \
            -w '%{http_code}' \
            -H "$authorization" \
            "$branch_api")
          if [ "$branch_code" = 404 ]; then
            bootstrap_code=$(curl -sS --connect-timeout 20 --max-time 60 \
              -o "$response" \
              -w '%{http_code}' \
              -X POST \
              -H "$authorization" \
              -H 'Accept: application/json' \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "content=$(printf '%s' 'Gitee mirror bootstrap; replaced by the GitHub source on this run.' | base64 -w 0)" \
              --data-urlencode 'message=Initialize Gitee mirror' \
              --data-urlencode 'branch=main' \
              "$repository_api/contents/.gitee-bootstrap")
            if [ "$bootstrap_code" != 201 ]; then
              echo "::error title=Unable to initialize Gitee main branch::Gitee API returned HTTP $bootstrap_code."
              jq -c '.' "$response" >&2 || true
              exit 1
            fi
          elif [ "$branch_code" != 200 ]; then
            echo "::error title=Unable to inspect Gitee main branch::Gitee API returned HTTP $branch_code."
            jq -c '.' "$response" >&2 || true
            exit 1
          fi

          tree_code=$(curl -sS --connect-timeout 20 --max-time 60 \
            -o "$response" \
            -w '%{http_code}' \
            -H "$authorization" \
            "$repository_api/git/trees/main?recursive=1")
          if [ "$tree_code" != 200 ]; then
            echo "::error title=Unable to inspect Gitee file tree::Gitee API returned HTTP $tree_code."
            jq -c '.' "$response" >&2 || true
            exit 1
          fi
          jq -r '.tree[]? | select(.type == "blob") | [.path, .sha] | @tsv' "$response" | sort -u > "$remote_paths"
          git ls-files | while IFS= read -r path; do
            [ -n "$path" ] || continue
            sha=$(git hash-object -- "$path")
            printf '%s\t%s\n' "$path" "$sha"
          done | sort -u > "$local_paths"

          sync_file() {
            local path="$1"
            local remote_sha="$2"
            local method=POST
            local file_code
            local encoded_path
            encoded_path=$(printf '%s' "$path" | jq -sRr @uri)
            base64 -w 0 -- "$path" > "$content_path"
            if [ -n "$remote_sha" ]; then
              method=PUT
            fi
            file_url="$repository_api/contents/$encoded_path"
            if [ "$method" = PUT ]; then
              file_code=$(curl -sS --connect-timeout 20 --max-time 180 \
                -o "$response" \
                -w '%{http_code}' \
                -X PUT \
                -H "$authorization" \
                -H 'Accept: application/json' \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "content@$content_path" \
                --data-urlencode "message=Sync from GitHub ${GITHUB_SHA}" \
                --data-urlencode 'branch=main' \
                --data-urlencode "sha=$remote_sha" \
                "$file_url")
            else
              file_code=$(curl -sS --connect-timeout 20 --max-time 180 \
                -o "$response" \
                -w '%{http_code}' \
                -X POST \
                -H "$authorization" \
                -H 'Accept: application/json' \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "content@$content_path" \
                --data-urlencode "message=Sync from GitHub ${GITHUB_SHA}" \
                --data-urlencode 'branch=main' \
                "$file_url")
            fi
            if [ "$file_code" != 201 ]; then
              echo "::error title=Unable to sync Gitee file $path::Gitee API returned HTTP $file_code."
              jq -c '.' "$response" >&2 || true
              exit 1
            fi
          }

          while IFS=$'\t' read -r path sha; do
            [ -n "$path" ] || continue
            local_sha=$(awk -F '\t' -v target="$path" '$1 == target { print $2; exit }' "$local_paths")
            if [ "$local_sha" != "$sha" ]; then
              sync_file "$path" "$sha"
            fi
          done < "$local_paths"

          while IFS=$'\t' read -r path sha; do
            [ -n "$path" ] || continue
            if ! awk -F '\t' -v target="$path" '$1 == target { found=1 } END { exit found ? 0 : 1 }' "$local_paths"; then
              encoded_path=$(printf '%s' "$path" | jq -sRr @uri)
              delete_code=$(curl -sS --connect-timeout 20 --max-time 180 \
                -o "$response" \
                -w '%{http_code}' \
                -X DELETE \
                -H "$authorization" \
                -H 'Accept: application/json' \
                --data-urlencode "access_token=$GITEE_TOKEN" \
                --data-urlencode "sha=$sha" \
                --data-urlencode "message=Sync from GitHub ${GITHUB_SHA}" \
                "$repository_api/contents/$encoded_path")
              if [ "$delete_code" != 200 ] && [ "$delete_code" != 204 ]; then
                echo "::error title=Unable to delete Gitee file $path::Gitee API returned HTTP $delete_code."
                jq -c '.' "$response" >&2 || true
                exit 1
              fi
            fi
          done < "$remote_paths"

      - name: Publish and verify Gitee repository
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          authorization="Authorization: token $GITEE_TOKEN"
          repository_name="${GITEE_REPOSITORY#*/}"
          repository_api="https://gitee.com/api/v5/repos/$GITEE_REPOSITORY"
          response="$RUNNER_TEMP/dada-gitee-repository-public.json"

          http_code=$(curl -sS --connect-timeout 20 --max-time 60 \
            -o "$response" \
            -w '%{http_code}' \
            -H "$authorization" \
            "$repository_api")
          if [ "$http_code" != 200 ] || ! jq -e \
            --arg repository "$GITEE_REPOSITORY" \
            '.full_name == $repository' "$response" >/dev/null; then
            echo "::error title=Unable to read Gitee repository after sync::Gitee API returned HTTP $http_code."
            exit 1
          fi

          if ! jq -e '.private == false' "$response" >/dev/null; then
            made_public_response="$RUNNER_TEMP/dada-gitee-repository-public-update.json"
            made_public_code=$(curl -sS --connect-timeout 20 --max-time 60 \
              -o "$made_public_response" \
              -w '%{http_code}' \
              -X PATCH \
              -H "$authorization" \
              -H 'Accept: application/json' \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "name=$repository_name" \
              --data-urlencode "path=$repository_name" \
              --data-urlencode 'private=false' \
              "$repository_api")
            if [ "$made_public_code" != 200 ]; then
              echo "::error title=Unable to publish Gitee repository::Gitee API returned HTTP $made_public_code."
              jq -c '.' "$made_public_response" >&2 || true
              exit 1
            fi
          fi

          repository_public=false
          for attempt in 1 2 3 4 5 6; do
            verification_code=$(curl -sS --connect-timeout 20 --max-time 60 \
              -o "$response" \
              -w '%{http_code}' \
              -H "$authorization" \
              "$repository_api")
            if [ "$verification_code" = 200 ] && jq -e \
              --arg repository "$GITEE_REPOSITORY" \
              '.full_name == $repository and .private == false' "$response" >/dev/null; then
              repository_public=true
              break
            fi
            [ "$attempt" -eq 6 ] || sleep 5
          done
          if [ "$repository_public" != true ]; then
            echo "::error title=Gitee repository is not public::The mirror must be public so users can access it without credentials."
            exit 1
          fi

          anonymous_response="$RUNNER_TEMP/dada-gitee-repository-public-check.json"
          anonymous_code=$(curl -sS --connect-timeout 20 --max-time 60 \
            -o "$anonymous_response" \
            -w '%{http_code}' \
            "$repository_api")
          if [ "$anonymous_code" != 200 ] || ! jq -e \
            --arg repository "$GITEE_REPOSITORY" \
            '.full_name == $repository and .private == false' "$anonymous_response" >/dev/null; then
            echo "::error title=Gitee repository is not publicly readable::The mirror is not accessible without a token."
            exit 1
          fi
